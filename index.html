<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>پول‌سنج</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0f;
            --card: #141420;
            --card-border: #1e1e2e;
            --text: #e8e8f0;
            --text-dim: #8888a0;
            --green: #00e676;
            --red: #ff5252;
            --accent: #7c4dff;
            --accent2: #448aff;
        }
        
        body {
            font-family: -apple-system, 'Segoe UI', 'Vazirmatn', 'IRANSans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-text-size-adjust: none;
            overscroll-behavior: none;
        }
        
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--bg) 0%, rgba(10,10,15,0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--card-border);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-dim);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .cat-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        
        .container {
            padding: 12px 12px 80px;
        }
        
        .category-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dim);
            padding: 12px 4px 8px;
        }
        
        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .price-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            transition: transform 0.15s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .price-card:active {
            transform: scale(0.97);
        }
        
        .price-card.up {
            border-color: rgba(0, 230, 118, 0.2);
        }
        
        .price-card.down {
            border-color: rgba(255, 82, 82, 0.2);
        }
        
        .card-icon {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .card-icon svg {
            width: 28px;
            height: 28px;
            display: block;
            margin: 0 auto 6px;
        }
        
        .card-name {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            line-height: 1.4;
        }
        
        .card-price {
            font-size: 17px;
            font-weight: 700;
            direction: ltr;
            text-align: right;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        
        .card-change {
            font-size: 11px;
            font-weight: 600;
            direction: ltr;
            text-align: right;
        }
        
        .card-change.up { color: var(--green); }
        .card-change.down { color: var(--red); }
        .card-change.flat { color: var(--text-dim); }
        
        .card-change::before {
            content: '';
            display: inline-block;
        }
        .card-change.up::before { content: '▲ '; font-size: 8px; }
        .card-change.down::before { content: '▼ '; font-size: 8px; }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            gap: 16px;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--card-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }
        
        .error-msg button {
            margin-top: 16px;
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        
        .refresh-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            z-index: 200;
        }
        
        .refresh-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            width: 0%;
            transition: width 1s linear;
        }
        
        .ts-text {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .coin-highlight {
            background: linear-gradient(135deg, rgba(124,77,255,0.08), rgba(68,138,255,0.08));
        }
        
        /* WebView adjustments */
        @media (display-mode: standalone) {
            .header { padding-top: env(safe-area-inset-top, 16px); }
            .container { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo">💰 پول‌سنج</div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="status-text">بروزرسانی...</span>
            </div>
        </div>
        <div class="categories" id="categories"></div>
    </div>
    
    <div class="container" id="content">
        <div class="loading">
            <div class="spinner"></div>
            <span style="color:var(--text-dim)">دریافت قیمت‌ها...</span>
        </div>
    </div>
    
    <div class="refresh-bar">
        <div class="refresh-bar-inner" id="refresh-bar"></div>
    </div>
    
    <script>
    const API = 'api.php';
    const REFRESH_INTERVAL = 30000; // 30s
    let currentCat = null;
    let data = null;
    let timer = null;
    let barTimer = null;

    async function fetchPrices() {
        try {
            const r = await fetch(API + '?t=' + Date.now());
            if (!r.ok) throw new Error('HTTP ' + r.status);
            data = await r.json();
            if (data.error) throw new Error(data.error);
            render();
            updateStatus(false);
        } catch (e) {
            console.error('Fetch error:', e);
            updateStatus(true);
        }
    }

    function updateStatus(error) {
        const el = document.getElementById('status-text');
        const dot = document.querySelector('.status-dot');
        if (error) {
            el.textContent = 'خطا در اتصال';
            dot.style.background = '#ff5252';
        } else {
            const t = new Date(data.ts);
            el.textContent = t.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
            dot.style.background = '#00e676';
        }
    }

    function render() {
        if (!data || !data.categories) return;
        
        // Render category buttons
        const catsEl = document.getElementById('categories');
        let html = '<button class="cat-btn active" onclick="filterCat(null)">همه</button>';
        for (const [key, cat] of Object.entries(data.categories)) {
            html += `<button class="cat-btn" onclick="filterCat('${key}')">${cat.title}</button>`;
        }
        catsEl.innerHTML = html;
        
        // Update active button
        catsEl.querySelectorAll('.cat-btn').forEach(btn => {
            if ((currentCat === null && btn.textContent === 'همه') ||
                btn.textContent === data.categories[currentCat]?.title) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Render price cards
        const content = document.getElementById('content');
        let cards = '';
        
        for (const [catKey, cat] of Object.entries(data.categories)) {
            if (currentCat && currentCat !== catKey) continue;
            
            cards += `<div class="category-title">${cat.title}</div>`;
            cards += '<div class="price-grid">';
            
            for (const item of cat.items) {
                const dir = item.direction || '';
                const changeClass = dir === 'up' ? 'up' : dir === 'down' ? 'down' : 'flat';
                const cardClass = dir ? ` ${dir}` : '';
                
                cards += `
                    <div class="price-card${cardClass}">
                        <div class="card-icon">${item.icon}</div>
                        <div class="card-name">${item.name}</div>
                        <div class="card-price">${item.price || '---'}</div>
                        <div class="card-change ${changeClass}">${item.change || '0'}</div>
                    </div>`;
            }
            
            cards += '</div>';
        }
        
        cards += `<div class="ts-text">آخرین بروزرسانی: ${new Date(data.ts).toLocaleString('fa-IR')}</div>`;
        content.innerHTML = cards;
    }

    function filterCat(cat) {
        currentCat = cat;
        render();
        // Update buttons
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        const activeIdx = cat === null ? 0 : 
            [...document.querySelectorAll('.cat-btn')].findIndex(b => b.textContent === data.categories[cat]?.title);
        if (activeIdx >= 0) {
            document.querySelectorAll('.cat-btn')[activeIdx].classList.add('active');
        }
    }

    function startRefresh() {
        // Animate progress bar
        const bar = document.getElementById('refresh-bar');
        let elapsed = 0;
        
        if (barTimer) clearInterval(barTimer);
        bar.style.transition = 'none';
        bar.style.width = '0%';
        
        setTimeout(() => {
            bar.style.transition = `width ${REFRESH_INTERVAL/1000}s linear`;
            bar.style.width = '100%';
        }, 50);
        
        if (timer) clearTimeout(timer);
        timer = setTimeout(async () => {
            await fetchPrices();
            startRefresh();
        }, REFRESH_INTERVAL);
    }

    // Init
    fetchPrices().then(() => startRefresh());
    
    // Pause when hidden
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (timer) clearTimeout(timer);
        } else {
            fetchPrices().then(() => startRefresh());
        }
    });
    </script>
</body>
</html>
